name: Restore canonical ChatPanel

on:
  push:
    branches: [main]

jobs:
  restore-chatpanel:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Restore canonical ChatPanel
        shell: bash
        run: |
          set -euo pipefail
          git show c911f553ef9eafbf580f424c04eca93782939ede:src/main/java/com/bajinho/continuebeans/ChatPanel.java > src/main/java/com/bajinho/continuebeans/ChatPanel.java
          if git diff --quiet -- src/main/java/com/bajinho/continuebeans/ChatPanel.java; then
            echo "ChatPanel already restored."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/com/bajinho/continuebeans/ChatPanel.java
          git commit -m "fix(ui): restore canonical dark ChatPanel selectors"
          git push
