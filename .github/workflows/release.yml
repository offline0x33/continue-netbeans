name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: mvn clean install -DskipTests

      - name: Run tests
        run: mvn test

      - name: Generate coverage report
        run: mvn jacoco:report

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: target/jacoco.exec
          flags: unittests
          name: codecov-umbrella

      - name: Build NBM package
        run: mvn package -DskipTests

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nbm-package
          path: target/*.nbm
          retention-days: 30

  release:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'maven'

      - name: Calculate next release version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          CURRENT_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          LATEST_STABLE_TAG=$(git tag --list 'v*' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V \
            | tail -n 1 || true)

          if [[ -n "${LATEST_STABLE_TAG}" ]]; then
            BASE_VERSION="${LATEST_STABLE_TAG#v}"
          else
            BASE_VERSION="${CURRENT_VERSION%-SNAPSHOT}"
          fi

          if [[ ! "${BASE_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Versão base inválida: ${BASE_VERSION}" >&2
            exit 1
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "${BASE_VERSION}"
          NEXT_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
          TAG="v${NEXT_VERSION}"

          if git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "A tag ${TAG} já existe; release abortado para evitar sobrescrita." >&2
            exit 1
          fi

          echo "Current Maven version: ${CURRENT_VERSION}"
          echo "Latest stable tag: ${LATEST_STABLE_TAG:-<none>}"
          echo "Release base version: ${BASE_VERSION}"
          echo "Calculated release version: ${NEXT_VERSION}"

          echo "version=${NEXT_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"

      - name: Set Maven release version
        run: |
          set -euo pipefail
          mvn -q versions:set -DnewVersion="${{ steps.version.outputs.version }}" -DgenerateBackupPoms=false

          EFFECTIVE_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          EXPECTED_VERSION="${{ steps.version.outputs.version }}"

          echo "Expected Maven version: ${EXPECTED_VERSION}"
          echo "Effective Maven version: ${EFFECTIVE_VERSION}"

          if [[ "${EFFECTIVE_VERSION}" != "${EXPECTED_VERSION}" ]]; then
            echo "Version mismatch: Maven is still using ${EFFECTIVE_VERSION}" >&2
            exit 1
          fi

          if [[ "${EFFECTIVE_VERSION}" == *SNAPSHOT* ]]; then
            echo "SNAPSHOT version is forbidden in a stable release." >&2
            exit 1
          fi

      - name: Build release package
        run: mvn clean package -DskipTests

      - name: Verify release artifacts
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"

          NBM="target/continue-beans-${VERSION}.nbm"
          JAR="target/continue-beans-${VERSION}.jar"

          test -f "${NBM}" || {
            echo "Expected NBM not found: ${NBM}" >&2
            find target -maxdepth 1 -type f -printf '%f\n' | sort
            exit 1
          }

          test -f "${JAR}" || {
            echo "Expected JAR not found: ${JAR}" >&2
            find target -maxdepth 1 -type f -printf '%f\n' | sort
            exit 1
          }

          echo "Release artifacts verified for ${VERSION}"

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }
          name: Continue Beans v${{ steps.version.outputs.version }}
          body: |
            ## Continue Beans AI Assistant v${{ steps.version.outputs.version }}

            Automated semantic patch release generated from `main`.

            ### Features
            - Complete function calling system with NetBeans APIs
            - Task-driven agent orchestration
            - Plugin/module management integration
            - Professional UI components
            - MCP tools integration

            ### Installation
            Download the `.nbm` file and install via NetBeans Plugin Manager.

            ### Changelog
            See [CHANGELOG.md](docs/CHANGELOG.md) for detailed changes.
          files: |
            target/*.nbm
            target/*.jar
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
