name: Fix directory count type

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor == 'github-actions[bot]' || github.actor == 'offline0x33'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch implementation and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/main/java/com/bajinho/continuebeans/ai/NetBeansFunctionExecutor.java')
          s = p.read_text()
          old = '"count", files.stream().filter(file -> "file".equals(file.get("type"))).count(),'
          new = '"count", files.stream().mapToInt(file -> "file".equals(file.get("type")) ? 1 : 0).sum(),'
          if old not in s:
              raise SystemExit('Expected count expression not found')
          p.write_text(s.replace(old, new, 1))
          PY
          rm .github/workflows/fix-directory-count-int.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/com/bajinho/continuebeans/ai/NetBeansFunctionExecutor.java .github/workflows/fix-directory-count-int.yml
          git commit -m 'fix: return integer file count'
          git push
